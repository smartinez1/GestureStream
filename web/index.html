<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestureStream</title>
    <style>
      html,
      body {
        background: #000;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      canvas#out {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: fixed;
        left: 10px;
        bottom: 10px;
        color: #eee;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        user-select: none;
        z-index: 10;
      }
      #status span {
        margin-right: 14px;
      }
      #status .on {
        color: #7dff7d;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ccc;
        font-size: 18px;
        background: #000;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <video id="cam" style="display: none" autoplay playsinline></video>
    <canvas id="out"></canvas>
    <div id="status">
      <span id="fps">FPS: --</span>
      <span id="eff-fire">🔥 Fire</span>
      <span id="eff-tree">🌳 Tree</span>
      <span id="eff-kaleido">🔮 Kaleido</span>
      <span id="eff-trail">✨ Trail</span>
    </div>
    <div id="loading">Loading MediaPipe models…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
